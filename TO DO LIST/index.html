<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced To-Do App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>TARUN'S To-Do App</h1>
        </header>
        <div class="task-input">
            <input type="text" id="task-title" placeholder="Task title">
            <input type="datetime-local" id="task-datetime">
            <button id="add-task-btn">Add Task</button>
        </div>
        <div class="task-controls">
            <input type="text" id="search-tasks" placeholder="Search tasks...">
            <button id="sort-tasks-btn">Sort by Date</button>
            <button id="clear-completed-btn">Clear Completed</button>
        </div>
        <div class="lists">
            <div class="list">
                <h2>Pending Tasks</h2>
                <ul id="pending-list"></ul>
            </div>
            <div class="list">
                <h2>Completed Tasks</h2>
                <ul id="completed-list"></ul>
            </div>
        </div>
        <footer>
            <p>Enhanced To-Do App &copy; 2025</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
